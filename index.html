<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stats.csv — Виртуализация + Web Worker + Пагинация</title>
  <style>
    :root{
      --bg:#0b0d10; --text:#e9eef5; --muted:#7e8a9a; --border:#242a33;
      --toolbar-h:56px; --th-h:40px; --row-h:28px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font:12px/1.25 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text)}
    .toolbar{display:flex;gap:12px;align-items:center;padding:10px 14px;height:var(--toolbar-h)}
    .toolbar h1{font-size:16px;margin:0 6px 0 0;color:#cfe3ff}
    .search{flex:1;position:relative}
    .search input{width:100%;padding:10px 36px;border-radius:10px;border:1px solid var(--border);background:#0e1218;color:var(--text);outline:none}
    .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.7}
    .meta{color:var(--muted);font-size:12px}
    .btn{border:1px solid var(--border);background:#0e1218;color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer}

    .table-wrap{height:calc(100vh - var(--toolbar-h));overflow:auto}
    table{width:100%;border-collapse:separate;border-spacing:0}
    thead th{background:#0f1216;color:#c7d2e3;font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
    thead tr:nth-child(1) th{position:sticky;top:0;z-index:3;height:var(--th-h)}
    thead th.sortable{cursor:pointer}
    thead th .sort{opacity:.6;margin-left:6px;font-size:11px}
    tbody td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
    tbody tr:nth-child(odd){background:rgba(255,255,255,0.02)}
    .num{text-align:right;font-variant-numeric:tabular-nums}
    .bool{text-align:center;font-weight:700}
    .heat{transition:background-color .06s ease}

    .pager{display:flex;gap:8px;align-items:center}
    .pager select,.pager input{background:#0e1218;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
    .spacer{height:0}
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Stats.csv</h1>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/></svg>
      <input id="q" placeholder="Глобальный поиск по всем столбцам (на лету)" autocomplete="off" />
    </div>
    <div class="pager">
      <label class="meta">Строк на страницу:</label>
      <select id="pageSize">
        <option value="2000">2 000</option>
        <option value="5000" selected>5 000</option>
        <option value="10000">10 000</option>
        <option value="0">Все</option>
      </select>
      <button class="btn" id="prev">◀</button>
      <span class="meta" id="pageInfo">—</span>
      <button class="btn" id="next">▶</button>
    </div>
    <button class="btn" id="reset">Сбросить</button>
    <div class="meta" id="counts"></div>
  </div>

  <div class="table-wrap" id="viewport">
    <table id="tbl">
      <thead>
        <tr id="thead-row"></tr>
      </thead>
      <tbody id="tbody">
        <!-- Виртуализация: top spacer / rows / bottom spacer -->
      </tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
  // ===== Schema (разрешённые столбцы) =====
  const SCHEMA = [
    { key:'name', label:'name', type:'text' },
    { key:'total games', label:'total games', type:'int' },
    { key:'win rate', label:'win rate', type:'pct2', heat:true },
    { key:'spawn / g', label:'spawn / g', type:'float2', heat:true },
    { key:'lvling', label:'lvling', type:'float2', heat:true },
    { key:'farm', label:'farm', type:'float2', heat:true },
    { key:'ground / game', label:'ground / game', type:'float2', heat:true },
    { key:'air / game', label:'air / game', type:'float2', heat:true },
    { key:'naval / game', label:'naval / game', type:'float2', heat:true },
    { key:'ground / spawn', label:'ground / spawn', type:'float2', heat:true },
    { key:'air / spawn', label:'air / spawn', type:'float2', heat:true },
    { key:'naval / spawn', label:'naval / spawn', type:'float2', heat:true },
    { key:'ground / death', label:'ground / death', type:'float2', heat:true },
    { key:'air / death', label:'air / death', type:'float2', heat:true },
    { key:'naval / death', label:'naval / death', type:'float2', heat:true },
    { key:'mode', label:'mode', type:'text' },
    { key:'Class', label:'Class', type:'text' },
    { key:'Move Type', label:'Move Type', type:'text' },
    { key:'rank', label:'rank', type:'int' },
    { key:'BR / a', label:'BR / a', type:'float2', heat:true },
    { key:'BR / r', label:'BR / r', type:'float2', heat:true },
    { key:'BR / s', label:'BR / s', type:'float2', heat:true },
    { key:'BRTank / r', label:'BRTank / r', type:'float2', heat:true },
    { key:'BRTank / s', label:'BRTank / s', type:'float2', heat:true },
    { key:'country', label:'country', type:'text' },
    { key:'Prem', label:'Prem', type:'bool' },
    { key:'Event', label:'Event', type:'bool' },
    { key:'Gift', label:'Gift', type:'bool' },
    { key:'Normal', label:'Normal', type:'bool' },
  ];
  const SCHEMA_MAP = new Map(SCHEMA.map(c=>[c.key,c]));
  const DISPLAY_COLUMNS = SCHEMA.map(c=>c.key);
  const NUMERIC_TYPES = new Set(['int','float2','pct2']);

  // ===== State =====
  const state = {
    sort:{key:null,dir:1}, // 1 asc, -1 desc
    filterText:'',
    filteredIdx:[], // индексы строк (по raw) после фильтрации/сортировки
    pageSize:5000,
    page:1,
    rowHeight:null,
    raw:[], // нормализованные строки
    mm:null // min/max по видимым столбцам для текущей выборки
  };

  // ===== Elements =====
  const $q = document.getElementById('q');
  const $tbody = document.getElementById('tbody');
  const $theadRow = document.getElementById('thead-row');
  const $counts = document.getElementById('counts');
  const $prev = document.getElementById('prev');
  const $next = document.getElementById('next');
  const $pageInfo = document.getElementById('pageInfo');
  const $pageSize = document.getElementById('pageSize');
  const $viewport = document.getElementById('viewport');
  const $reset = document.getElementById('reset');

  // ===== Worker (фильтрация/сортировка/минимаксы) =====
  const workerCode = `
    let RAW=[], DISPLAY_COLUMNS=[], NUMERIC_TYPES=new Set(), SCHEMA_MAP=null;
    function buildSearchString(r){
      return DISPLAY_COLUMNS.map(k=>{ const v=r[k]; if(typeof v==='number') return v; if(typeof v==='boolean') return v?'true':'false'; return v??''; }).join(' | ').toLowerCase();
    }
    function cmp(a,b,t){ if(a==null&&b==null)return 0; if(a==null)return 1; if(b==null)return -1; return (NUMERIC_TYPES.has(t)?(a-b):String(a).localeCompare(String(b),'ru',{sensitivity:'base'})); }
    onmessage = (e)=>{
      const {type} = e.data;
      if(type==='init'){
        RAW = e.data.raw;
        DISPLAY_COLUMNS = e.data.cols;
        NUMERIC_TYPES = new Set(e.data.numericTypes);
        SCHEMA_MAP = new Map(e.data.schema.map(c=>[c.key,c]));
        // build __search
        for(const r of RAW){ r.__search = buildSearchString(r); }
        postMessage({type:'inited'});
      } else if(type==='filter'){
        const { q, sortKey, sortDir } = e.data;
        let idx = [];
        if(!q){ idx = RAW.map((_,i)=>i); }
        else{
          const qq = q.toLowerCase();
          for(let i=0;i<RAW.length;i++){ if(RAW[i].__search.includes(qq)) idx.push(i); }
        }
        if(sortKey){
          const t = (SCHEMA_MAP.get(sortKey)||{}).type;
          idx.sort((ia,ib)=>{ const a=RAW[ia][sortKey]; const b=RAW[ib][sortKey]; return cmp(a,b,t) * sortDir; });
        }
        // mm for numeric columns
        const mm = new Map();
        for(const key of DISPLAY_COLUMNS){
          const col = SCHEMA_MAP.get(key); if(!col || !['int','float2','pct2'].includes(col.type)) continue;
          let min=Infinity,max=-Infinity; for(const i of idx){ const v=RAW[i][key]; if(v==null) continue; if(v<min)min=v; if(v>max)max=v; }
          if(min===Infinity) {min=null;max=null;} mm.set(key,{min,max});
        }
        postMessage({type:'filtered', idx, mm: Array.from(mm.entries())});
      }
    };
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([workerCode], {type:'text/javascript'})));

  // ===== Init =====
  init();
  async function init(){
    buildHeader();

    const res = await fetch('stats.csv', { cache: 'no-store' });
    if(!res.ok){ $counts.textContent = 'Ошибка загрузки CSV'; return; }
    const text = await res.text();
    // Парсинг в отдельном потоке PapaParse
    const parsed = await new Promise(resolve=>{
      Papa.parse(text, { header:true, skipEmptyLines:true, worker:true, complete: resolve });
    });
    const rows = (parsed.data || []).map(coerceRow).map(keepWhitelisted);
    state.raw = rows;

    // Отправляем данные в наш воркер
    worker.postMessage({ type:'init', raw: state.raw, cols: DISPLAY_COLUMNS, numericTypes:[...NUMERIC_TYPES], schema: SCHEMA });
    worker.onmessage = (e)=>{
      const {type} = e.data;
      if(type==='inited') {
        runFilter();
      } else if(type==='filtered') {
        state.filteredIdx = e.data.idx;
        // восстановить Map из Array
        state.mm = new Map(e.data.mm);
        updateCounts();
        state.page = 1; // сброс на первую при новой фильтрации
        renderVirtualized();
      }
    };

    bindUI();
  }

  // ===== Helpers =====
  function keepWhitelisted(row){ const out={}; for(const k of DISPLAY_COLUMNS) if(k in row) out[k]=row[k]; return out; }
  function coerceRow(row){ const out={}; for(const [k,v] of Object.entries(row)){ if(!SCHEMA_MAP.has(k)) continue; out[k]=coerce(v, SCHEMA_MAP.get(k).type); } return out; }
  function coerce(v,t){ const s=String(v??'').trim(); if(t==='text') return s; if(t==='bool'){ const k=s.toLowerCase(); return ['true','1','yes','y','да','истина','✓'].includes(k); } if(t==='int'){ const n=Number(s.replace(/\s+/g,'')); return Number.isFinite(n)?n:null; } if(t==='float2'||t==='pct2'){ if(!s) return null; const num = s.endsWith('%')? parseFloat(s)/100 : Number(s.replace(',','.')); return Number.isFinite(num)?num:null; } return s; }
  function formatCell(v,t){ if(v==null||v==='') return '—'; if(t==='int') return String(v); if(t==='float2') return v.toFixed(2); if(t==='pct2') return (v*100).toFixed(2)+'%'; if(t==='bool') return v?'✓':''; return String(v); }

  function buildHeader(){
    $theadRow.innerHTML='';
    for(const key of DISPLAY_COLUMNS){ const col=SCHEMA_MAP.get(key); const th=document.createElement('th'); th.textContent=col.label; th.dataset.key=key; th.className='sortable'; const s=document.createElement('span'); s.className='sort'; th.appendChild(s); th.addEventListener('click',()=>onSort(key)); $theadRow.appendChild(th);} }

  function onSort(key){ const prev=state.sort.key; state.sort = (prev===key)? {key,dir:state.sort.dir*-1} : {key,dir:1}; markSort(); runFilter(); }
  function markSort(){ [...$theadRow.children].forEach(th=>{ const k=th.dataset.key; const s=th.querySelector('.sort'); s.textContent = (state.sort.key===k)? (state.sort.dir===1?'▲':'▼') : ''; }); }

  function bindUI(){
    // глобальный поиск (debounce)
    let t; $q.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(()=>{ state.filterText=$q.value.toLowerCase(); runFilter(); },120); });
    $reset.addEventListener('click',()=>{ $q.value=''; state.filterText=''; state.sort={key:null,dir:1}; markSort(); runFilter(); });
    $pageSize.addEventListener('change',()=>{ state.pageSize=Number($pageSize.value); state.page=1; renderVirtualized(); });
    $prev.addEventListener('click',()=>{ if(state.page>1){ state.page--; renderVirtualized(); } });
    $next.addEventListener('click',()=>{ const tp=totalPages(); if(state.page<tp){ state.page++; renderVirtualized(); } });
    $viewport.addEventListener('scroll', onScrollVirtual);
    window.addEventListener('resize',()=>{ state.rowHeight=null; renderVirtualized(); });
  }

  function runFilter(){ worker.postMessage({ type:'filter', q: state.filterText, sortKey: state.sort.key, sortDir: state.sort.dir }); }

  function updateCounts(){
    $counts.textContent = `${state.filteredIdx.length} строк` + (state.filteredIdx.length!==state.raw.length?` из ${state.raw.length}`:'');
  }

  function currentPageSlice(){
    if(!state.filteredIdx.length) return [];
    if(!state.pageSize || state.pageSize===0) return state.filteredIdx; // Все
    const start=(state.page-1)*state.pageSize; return state.filteredIdx.slice(start, start+state.pageSize);
  }
  function totalPages(){ if(!state.pageSize || state.pageSize===0) return 1; return Math.max(1, Math.ceil(state.filteredIdx.length/state.pageSize)); }

  // ===== Виртуализация строк =====
  function measureRowHeight(){
    if(state.rowHeight) return state.rowHeight;
    // Синтетический замер: рендерим одну строку
    const tr=document.createElement('tr');
    const td=document.createElement('td'); td.colSpan=DISPLAY_COLUMNS.length; td.textContent=''; tr.appendChild(td); $tbody.innerHTML=''; $tbody.appendChild(tr);
    const h=tr.getBoundingClientRect().height || parseFloat(getComputedStyle(tr).height) || 28;
    state.rowHeight=h; return h;
  }

  function onScrollVirtual(){ renderVirtualized(); }

  function renderVirtualized(){
    const pageIdx = currentPageSlice();
    const rowCount = pageIdx.length;
    const rh = measureRowHeight();
    const vpH = $viewport.clientHeight;
    const scrollTop = $viewport.scrollTop;
    const overscan = Math.ceil(vpH / rh) * 2; // буфер ~2 экрана
    const start = Math.max(0, Math.floor(scrollTop / rh) - overscan);
    const end = Math.min(rowCount, Math.ceil((scrollTop + vpH) / rh) + overscan);

    const topPad = start * rh;
    const bottomPad = (rowCount - end) * rh;

    // обновить пагер
    const tp = totalPages();
    $pageInfo.textContent = `${state.page}/${tp}`;

    // рендер
    const frag = document.createDocumentFragment();
    $tbody.innerHTML='';

    // верхний спейсер
    if(topPad>0){ const trS=document.createElement('tr'); const tdS=document.createElement('td'); tdS.colSpan=DISPLAY_COLUMNS.length; tdS.style.height=topPad+"px"; trS.appendChild(tdS); frag.appendChild(trS); }

    for(let i=start;i<end;i++){
      const row = state.raw[ pageIdx[i] ];
      const tr = document.createElement('tr');
      for(const key of DISPLAY_COLUMNS){
        const col = SCHEMA_MAP.get(key);
        const td = document.createElement('td');
        if(col.type==='bool') td.classList.add('bool');
        if(NUMERIC_TYPES.has(col.type)) td.classList.add('num','heat');
        const val = row[key];
        td.textContent = formatCell(val, col.type);
        if(NUMERIC_TYPES.has(col.type)) applySolidHeat(td, val, state.mm.get(key));
        tr.appendChild(td);
      }
      frag.appendChild(tr);
    }

    // нижний спейсер
    if(bottomPad>0){ const trE=document.createElement('tr'); const tdE=document.createElement('td'); tdE.colSpan=DISPLAY_COLUMNS.length; tdE.style.height=bottomPad+"px"; trE.appendChild(tdE); frag.appendChild(trE); }

    $tbody.appendChild(frag);
  }

  function applySolidHeat(td, val, mm){
    const {min,max} = mm || {}; if(min==null||max==null||max<=min||val==null){ td.style.backgroundColor='transparent'; return; }
    const norm = (val - min) / (max - min); const hue = 120 * norm; td.style.backgroundColor = `hsla(${hue}, 80%, 30%, 0.42)`;
  }
  </script>
</body>
</html>
