<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stats – october</title>
  <style>
    :root { --bg:#0b0d10; --muted:#7e8a9a; --text:#e9eef5; --border:#242a33; --header:#0f1216; --toolbar-h:58px; --th-h:40px; }
    *{ box-sizing:border-box }
    html, body { height:100% }
    body { margin:0; font:12px/1.25 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,"Noto Sans",sans-serif; background:var(--bg); color:var(--text) }

    .toolbar { display:flex; gap:12px; align-items:center; padding:14px 16px; height:var(--toolbar-h) }
    .toolbar h1 { font-size:16px; margin:0 8px 0 0; color:#cfe3ff; letter-spacing:.2px }
    .search { flex:1; position:relative }
    .search input { width:100%; padding:10px 36px; border-radius:10px; border:1px solid var(--border); background:#0e1218; color:var(--text); outline:none }
    .search svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.7 }
    .meta { color:var(--muted); font-size:12px }
    .btn { border:1px solid var(--border); background:#0e1218; color:var(--text); padding:8px 10px; border-radius:10px; cursor:pointer }
    .table-wrap { height: calc(100vh - var(--toolbar-h)); overflow:auto; }
    table { width:100%; border-collapse:separate; border-spacing:0 }

    thead th { background:#0f1216; color:#c7d2e3; font-weight:600; text-align:left; padding:8px 8px; border-bottom:1px solid var(--border); white-space:nowrap }
    thead tr:nth-child(1) th { position:sticky; top:0; z-index:3; height:var(--th-h) }
    thead tr:nth-child(2) th { position:sticky; top:var(--th-h); z-index:2; background:#0d1015 }

    thead th.sortable { cursor:pointer }
    thead th .sort { opacity:.6; margin-left:6px; font-size:11px }

    tbody tr:nth-child(odd) { background:rgba(255,255,255,0.02) }
    tbody td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top }

    .num { text-align:right; font-variant-numeric:tabular-nums }
    .bool { text-align:center; font-weight:700 }

    .filter-cell { padding:6px }
    .filter-input, .filter-min, .filter-max { width:100%; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:#0e1218; color:var(--text); outline:none }
    .range { display:flex; gap:6px }

    .multi { position:relative }
    .multi details { width:100% }
    .multi summary { list-style:none; cursor:pointer; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:#0e1218 }
    .multi summary::marker{ display:none }
    .multi .panel { position:absolute; top:38px; left:0; min-width:220px; max-width:360px; max-height:260px; overflow:auto; background:#0f1216; border:1px solid var(--border); border-radius:10px; padding:8px; z-index:10; box-shadow:0 10px 30px rgba(0,0,0,.35) }
    .multi .panel .panel-search { width:100%; margin-bottom:6px; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:#0e1218; color:#fff }
    .multi .panel label { display:flex; align-items:center; gap:8px; padding:4px 6px }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px }
    .chip { font-size:12px; border:1px solid var(--border); padding:2px 6px; border-radius:999px; background:#11161d }

    .pager { display:flex; gap:8px; align-items:center; margin-left:8px }
    .pager select { background:#0e1218; color:#e9eef5; border:1px solid var(--border); border-radius:8px; padding:6px 8px }
    .heat { transition:background-color .06s ease }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Stats.csv</h1>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/></svg>
      <input id="q" placeholder="Глобальный поиск по всем столбцам (на лету)" autocomplete="off" />
    </div>
    <div class="pager">
      <label class="meta">Строк/стр:</label>
      <select id="pageSize">
        <option value="0">Все</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <button class="btn" id="prev">◀</button>
      <span class="meta" id="pageInfo">—</span>
      <button class="btn" id="next">▶</button>
      <button class="btn" id="reset">Сбросить</button>
    </div>
    <div class="meta" id="counts"></div>
  </div>

  <div class="table-wrap" id="viewport">
    <table id="tbl">
      <thead>
        <tr id="thead-row"></tr>
        <tr id="filter-row"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
  // -------- Schema --------
  const SCHEMA = [
    { key:'name', type:'text', label:'name' },
    { key:'total games', type:'int', label:'total games' },
    { key:'win rate', type:'pct2', label:'win rate', heat:true },
    { key:'spawn / g', type:'float2', label:'spawn / g', heat:true },
    { key:'lvling', type:'float2', label:'lvling', heat:true },
    { key:'farm', type:'float2', label:'farm', heat:true },
    { key:'ground / game', type:'float2', label:'ground / game', heat:true },
    { key:'air / game', type:'float2', label:'air / game', heat:true },
    { key:'naval / game', type:'float2', label:'naval / game', heat:true },
    { key:'ground / spawn', type:'float2', label:'ground / spawn', heat:true },
    { key:'air / spawn', type:'float2', label:'air / spawn', heat:true },
    { key:'naval / spawn', type:'float2', label:'naval / spawn', heat:true },
    { key:'ground / death', type:'float2', label:'ground / death', heat:true },
    { key:'air / death', type:'float2', label:'air / death', heat:true },
    { key:'naval / death', type:'float2', label:'naval / death', heat:true },
    { key:'mode', type:'text', label:'mode' },
    { key:'Class', type:'text', label:'Class' },
    { key:'Move Type', type:'text', label:'Move Type' },
    { key:'rank', type:'int', label:'rank' },
    { key:'BR / a', type:'float2', label:'BR / a', heat:true },
    { key:'BR / r', type:'float2', label:'BR / r', heat:true },
    { key:'BR / s', type:'float2', label:'BR / s', heat:true },
    { key:'BRTank / r', type:'float2', label:'BRTank / r', heat:true },
    { key:'BRTank / s', type:'float2', label:'BRTank / s', heat:true },
    { key:'country', type:'text', label:'country' },
    { key:'Prem', type:'bool', label:'Prem' },
    { key:'Event', type:'bool', label:'Event' },
    { key:'Gift', type:'bool', label:'Gift' },
    { key:'Normal', type:'bool', label:'Normal' },
  ];
  const SCHEMA_MAP = new Map(SCHEMA.map(c=>[c.key,c]));
  const DISPLAY_COLUMNS = SCHEMA.map(c=>c.key);
  const NUMERIC_TYPES = new Set(['int','float2','pct2']);

  // -------- State --------
  const state = {
    raw: [],
    uniques: new Map(),
    filteredIdx: [],
    sort: { key:null, dir:1 },
    filterText: '',
    colFilters: {},
    page: 1,
    pageSize: 100,
    rowHeight: null,
    mmPage: null,
  };

  // -------- DOM --------
  const $theadRow = document.getElementById('thead-row');
  const $filterRow = document.getElementById('filter-row');
  const $tbody = document.getElementById('tbody');
  const $counts = document.getElementById('counts');
  const $q = document.getElementById('q');
  const $prev = document.getElementById('prev');
  const $next = document.getElementById('next');
  const $pageInfo = document.getElementById('pageInfo');
  const $pageSize = document.getElementById('pageSize');
  const $viewport = document.getElementById('viewport');
  const $reset = document.getElementById('reset');

  // -------- Worker --------
  const workerCode = `
    let RAW=[], DISPLAY_COLUMNS=[], SCHEMA_MAP=null;
    function buildSearchString(r){
      return DISPLAY_COLUMNS.map(k=>{ const v=r[k]; if(typeof v==='number') return v; if(typeof v==='boolean') return v?'true':'false'; return v??''; }).join(' | ').toLowerCase();
    }
    function passColumnFilters(r, colFilters){
      for(const [key,conf] of Object.entries(colFilters||{})){
        if(!conf) continue; const t=(SCHEMA_MAP.get(key)||{}).type; const v=r[key];
        if(conf.kind==='text'){ const s=String(v??'').toLowerCase(); if(!s.includes(conf.value)) return false; }
        else if(conf.kind==='range'){ const {min,max}=conf; if(min!=null && (v==null||v<min)) return false; if(max!=null && (v==null||v>max)) return false; }
        else if(conf.kind==='multi'){ const set=new Set(conf.set||conf.values||[]); if(set.size && !set.has(v)) return false; }
      }
      return true;
    }
    function cmp(a,b,t){ if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1; return (['int','float2','pct2'].includes(t)?(a-b):String(a).localeCompare(String(b),'ru',{sensitivity:'base'})); }
    onmessage = (e)=>{
      const {type} = e.data;
      if(type==='init'){
        RAW = e.data.raw; DISPLAY_COLUMNS=e.data.cols; SCHEMA_MAP = new Map(e.data.schema.map(c=>[c.key,c]));
        for(const r of RAW){ r.__search = buildSearchString(r); }
        postMessage({type:'inited'});
      } else if(type==='filter'){
        const { q, sortKey, sortDir, colFilters } = e.data;
        let idx = [];
        const hasQ = !!q; const qq = hasQ ? q.toLowerCase() : '';
        for(let i=0;i<RAW.length;i++){
          const r=RAW[i];
          if(hasQ && !r.__search.includes(qq)) continue;
          if(!passColumnFilters(r, colFilters)) continue;
          idx.push(i);
        }
        if(sortKey){
          const t=(SCHEMA_MAP.get(sortKey)||{}).type;
          idx.sort((ia,ib)=>{ const a=RAW[ia][sortKey], b=RAW[ib][sortKey]; return cmp(a,b,t) * sortDir; });
        }
        postMessage({type:'filtered', idx});
      }
    };
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([workerCode], {type:'text/javascript'})));

  // -------- Init --------
  init();
  async function init(){
    buildHeader();

    const res = await fetch('stats.csv', { cache:'no-store' });
    if(!res.ok){ $counts.textContent='Ошибка загрузки CSV'; return; }
    const text = await res.text();
    const parsed = await new Promise(resolve=>{
      Papa.parse(text, { header:true, skipEmptyLines:true, worker:true, complete: resolve });
    });
    const rows = (parsed.data||[]).map(coerceRow).map(keepWhitelisted);
    state.raw = rows;

    computeUniques();
    buildFilters();

    worker.postMessage({ type:'init', raw: state.raw, cols: DISPLAY_COLUMNS, schema: SCHEMA });
    worker.onmessage = (e)=>{
      const {type} = e.data;
      if(type==='inited'){
        restoreFromURL();
        $pageSize.value = String(state.pageSize);
        updateStickyOffsets();        // важный вызов
        runFilter();
      } else if(type==='filtered'){
        state.filteredIdx = e.data.idx;
        updateCounts();
        const tp = totalPages(); if(state.page>tp) state.page=tp;
        renderVirtualized(false);
      }
    };

    bindUI();
  }

  // -------- Utils --------
  function keepWhitelisted(row){ const out={}; for(const k of DISPLAY_COLUMNS) if(k in row) out[k]=row[k]; return out; }
  function coerceRow(row){ const out={}; for(const [k,v] of Object.entries(row)){ if(!SCHEMA_MAP.has(k)) continue; out[k]=coerce(v, SCHEMA_MAP.get(k).type); } return out; }
  function coerce(v,t){ const s=String(v??'').trim(); if(t==='text') return s; if(t==='bool'){ const k=s.toLowerCase(); return ['true','1','yes','y','да','истина','✓'].includes(k); } if(t==='int'){ const n=Number(s.replace(/\s+/g,'')); return Number.isFinite(n)?n:null; } if(t==='float2'||t==='pct2'){ if(!s) return null; const num=s.endsWith('%')? parseFloat(s)/100 : Number(s.replace(',','.')); return Number.isFinite(num)?num:null; } return s; }
  function formatCell(v,t){ if(v==null||v==='') return '—'; if(t==='int') return String(v); if(t==='float2') return v.toFixed(2); if(t==='pct2') return (v*100).toFixed(2)+'%'; if(t==='bool') return v?'✓':''; return String(v); }

  function computeUniques(){
    for(const key of DISPLAY_COLUMNS){
      const set = new Set();
      for(const r of state.raw){ const v=r[key]; if(v===''||v==null) continue; set.add(v); if(set.size>1000) break; }
      const arr = Array.from(set).sort((a,b)=>{ const t=SCHEMA_MAP.get(key).type; return NUMERIC_TYPES.has(t)?(a-b):String(a).localeCompare(String(b),'ru'); });
      state.uniques.set(key, arr);
    }
  }

  // -------- Header / Sort --------
  function buildHeader(){
    $theadRow.innerHTML='';
    for(const key of DISPLAY_COLUMNS){
      const col = SCHEMA_MAP.get(key);
      const th = document.createElement('th');
      th.textContent = col.label;
      th.className = 'sortable';
      th.dataset.key = key;
      const s = document.createElement('span'); s.className='sort'; th.appendChild(s);
      th.addEventListener('click', ()=> onSort(key));
      $theadRow.appendChild(th);
    }
  }
  function onSort(key){ const prev=state.sort.key; state.sort = (prev===key) ? {key, dir: state.sort.dir*-1} : {key, dir:1}; markSort(); runFilter(); }
  function markSort(){ [...$theadRow.children].forEach(th=>{ const k=th.dataset.key; const s=th.querySelector('.sort'); s.textContent = (state.sort.key===k) ? (state.sort.dir===1?'▲':'▼') : ''; }); }

  // -------- Sticky header measure --------
  function updateStickyOffsets(){
    try{
      const h1 = Math.round(($theadRow.getBoundingClientRect().height)||40);
      document.documentElement.style.setProperty('--th-h', h1 + 'px');
    }catch(_){}
  }
  window.addEventListener('resize', updateStickyOffsets);

  // -------- Filters UI --------
  function buildFilters(){
    $filterRow.innerHTML='';
    for(const key of DISPLAY_COLUMNS){
      const col = SCHEMA_MAP.get(key);
      const th = document.createElement('th'); th.className='filter-cell';

      if(col.type==='bool' || col.type==='text' || (col.type==='int' && state.uniques.get(key).length<=50)){
        const wrap = document.createElement('div'); wrap.className='multi';
        wrap.innerHTML = `
          <details>
            <summary>выбрать…</summary>
            <div class="panel">
              <input class="panel-search" placeholder="поиск по списку"/>
              <div class="opts"></div>
            </div>
          </details>
          <div class="chips" data-key="${key}"></div>`;
        const details = wrap.querySelector('details');
        const panel = wrap.querySelector('.panel');
        const search = panel.querySelector('.panel-search');
        const opts = panel.querySelector('.opts');
        const chips = wrap.querySelector('.chips');
        const values = state.uniques.get(key);

        // Рендер опций
        function renderOptions(filter=''){
          opts.innerHTML='';
          const f = filter.toLowerCase();
          const selected = (state.colFilters[key] && state.colFilters[key].kind==='multi')
            ? (state.colFilters[key].set instanceof Set ? state.colFilters[key].set : new Set(state.colFilters[key].set))
            : new Set();
          values.forEach(v=>{
            const txt = String(formatCell(v, col.type));
            if (f && !txt.toLowerCase().includes(f)) return;
            const id = `f_${key}_${String(v).replace(/[^\w]+/g,'_')}`;
            const label = document.createElement('label');
            const checked = selected.has(v) ? 'checked' : '';
            label.innerHTML = `<input type="checkbox" id="${id}" ${checked}> <span>${txt}</span>`;
            label.dataset.value = String(v);
            opts.appendChild(label);
          });
        }
        renderOptions();
        search.addEventListener('input', ()=> renderOptions(search.value));

        // Делегирование: клик по чекбоксу — применяем фильтр и ЗАКРЫВАЕМ details
        opts.addEventListener('change', (e)=>{
          const input = e.target;
          if (input && input.type === 'checkbox'){
            const lbl = input.closest('label');
            if (!lbl) return;
            const rawVal = lbl.dataset.value;
            let val = rawVal;
            if (col.type === 'bool') val = (rawVal === 'true');
            if (col.type === 'int')  val = Number(rawVal);
            toggleMulti(key, val, chips);
            // автозакрытие
            details.open = false;
            // обновить высоту шапки
            updateStickyOffsets();
          }
        });

        th.appendChild(wrap);
      }
      else if (NUMERIC_TYPES.has(col.type)){
        const rng = document.createElement('div'); rng.className='range';
        const min = document.createElement('input'); const max = document.createElement('input');
        min.type='text'; max.type='text'; min.placeholder='мин'; max.placeholder='макс';
        min.className='filter-min'; max.className='filter-max';
        const handler = ()=> setColFilter(key,{ kind:'range', min: parseMaybeNumber(min.value,col.type), max: parseMaybeNumber(max.value,col.type) });
        min.addEventListener('input', handler); max.addEventListener('input', handler);
        rng.appendChild(min); rng.appendChild(max); th.appendChild(rng);
      }
      else{
        const inp = document.createElement('input'); inp.type='text'; inp.placeholder='фильтр'; inp.className='filter-input';
        inp.addEventListener('input', ()=> setColFilter(key,{ kind:'text', value: inp.value.toLowerCase() }));
        th.appendChild(inp);
      }

      $filterRow.appendChild(th);
    }

    // Закрытие всех details по Esc (удобство)
    $filterRow.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape'){
        document.querySelectorAll('#filter-row details[open]').forEach(d=> d.open=false);
        updateStickyOffsets();
      }
    }, true);

    // Пересчёт высоты шапки при закрытии/открытии details
    $filterRow.addEventListener('toggle', (e)=>{
      if (e.target && e.target.tagName === 'DETAILS') updateStickyOffsets();
    }, true);
  }

  function toggleMulti(key, value, chipsEl){
    const cur = state.colFilters[key] || { kind:'multi', set:new Set() };
    if (!(cur.set instanceof Set)) cur.set = new Set(cur.set);
    if (cur.set.has(value)) cur.set.delete(value); else cur.set.add(value);
    state.colFilters[key] = cur;
    updateChips(chipsEl, cur.set);
    runFilter();
  }
  function updateChips(chipsEl, set){
    chipsEl.innerHTML='';
    for(const v of set){ const s=document.createElement('span'); s.className='chip'; s.textContent=String(v); chipsEl.appendChild(s); }
  }
  function parseMaybeNumber(str, type){
    const s=String(str||'').trim(); if(!s) return null;
    const v = type==='pct2' ? (s.endsWith('%')? parseFloat(s)/100 : Number(s.replace(',','.'))) : Number(s.replace(',','.'));
    return Number.isFinite(v)?v:null;
  }
  function setColFilter(key, conf){ state.colFilters[key]=conf; runFilter(); }

  // -------- Bindings --------
  function bindUI(){
    let t; $q.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>{ state.filterText=$q.value.toLowerCase(); state.page=1; runFilter(); },120); });
    $pageSize.addEventListener('change', ()=>{ state.pageSize=Number($pageSize.value); state.page=1; syncURL(); renderVirtualized(true); });
    $prev.addEventListener('click', ()=>{ if(state.page>1){ state.page--; syncURL(); renderVirtualized(true);} });
    $next.addEventListener('click', ()=>{ const tp=totalPages(); if(state.page<tp){ state.page++; syncURL(); renderVirtualized(true);} });
    $viewport.addEventListener('scroll', onScrollVirtual);
    window.addEventListener('resize', ()=>{ state.rowHeight=null; renderVirtualized(false); });
    $reset.addEventListener('click', ()=>{ resetAll(); });
  }
  function resetAll(){
    state.filterText=''; $q.value='';
    state.colFilters={}; state.sort={key:null,dir:1}; state.page=1;
    buildFilters(); runFilter();
  }

  // -------- Worker interaction --------
  function runFilter(){
    syncURL();
    const colFilters = {};
    for(const [k,conf] of Object.entries(state.colFilters)){
      if(!conf) continue;
      if(conf.kind==='multi') colFilters[k] = { kind:'multi', set:[...(conf.set instanceof Set ? conf.set : new Set(conf.set))] };
      else if(conf.kind==='range') colFilters[k] = { kind:'range', min: conf.min, max: conf.max };
      else if(conf.kind==='text') colFilters[k] = { kind:'text', value: conf.value };
    }
    worker.postMessage({ type:'filter', q: state.filterText, sortKey: state.sort.key, sortDir: state.sort.dir, colFilters });
  }

  function updateCounts(){ $counts.textContent = `${state.filteredIdx.length} строк` + (state.filteredIdx.length!==state.raw.length ? ` из ${state.raw.length}` : ''); }

  // -------- Pagination --------
  function totalPages(){ if(!state.pageSize||state.pageSize===0) return 1; return Math.max(1, Math.ceil(state.filteredIdx.length/state.pageSize)); }
  function currentPageIdx(){ if(!state.pageSize||state.pageSize===0) return state.filteredIdx; const start=(state.page-1)*state.pageSize; return state.filteredIdx.slice(start, start+state.pageSize); }

  // -------- Virtualization --------
  function measureRowHeight(){ if(state.rowHeight) return state.rowHeight; const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=DISPLAY_COLUMNS.length; td.textContent=''; tr.appendChild(td); $tbody.innerHTML=''; $tbody.appendChild(tr); const h=tr.getBoundingClientRect().height||28; state.rowHeight=h; return h; }
  function onScrollVirtual(){ renderVirtualized(false); }

  function renderVirtualized(resetScroll){
    const pageIdx = currentPageIdx();
    const rowCount = pageIdx.length;
    const rh = measureRowHeight();
    if(resetScroll) $viewport.scrollTop = 0;
    const vpH = $viewport.clientHeight; const scrollTop = $viewport.scrollTop; const overscan = Math.ceil(vpH / rh) * 2;
    const start = Math.max(0, Math.floor(scrollTop / rh) - overscan);
    const end = Math.min(rowCount, Math.ceil((scrollTop + vpH) / rh) + overscan);

    const tp = totalPages(); $pageInfo.textContent = `${state.page}/${tp}`;

    // min/max по текущей странице
    const mm = new Map();
    for(const key of DISPLAY_COLUMNS){
      const col=SCHEMA_MAP.get(key); if(!NUMERIC_TYPES.has(col.type)) continue;
      let min=Infinity,max=-Infinity;
      for(const i of pageIdx){ const v=state.raw[i][key]; if(v==null) continue; if(v<min) min=v; if(v>max) max=v; }
      if(min===Infinity) min=max=null;
      mm.set(key,{min,max});
    }
    state.mmPage = mm;

    const frag = document.createDocumentFragment();
    $tbody.innerHTML='';

    if(start>0){ const trS=document.createElement('tr'); const tdS=document.createElement('td'); tdS.colSpan=DISPLAY_COLUMNS.length; tdS.style.height=(start*rh)+"px"; trS.appendChild(tdS); frag.appendChild(trS); }

    for(let i=start;i<end;i++){
      const row = state.raw[ pageIdx[i] ];
      const tr = document.createElement('tr');
      for(const key of DISPLAY_COLUMNS){
        const col = SCHEMA_MAP.get(key);
        const td = document.createElement('td');
        if(col.type==='bool') td.classList.add('bool');
        if(NUMERIC_TYPES.has(col.type)) td.classList.add('num','heat');
        const val = row[key];
        td.textContent = formatCell(val, col.type);
        if(NUMERIC_TYPES.has(col.type)) applySolidHeat(td, val, mm.get(key));
        tr.appendChild(td);
      }
      frag.appendChild(tr);
    }

    const bottomPad = (rowCount - end) * rh; if(bottomPad>0){ const trE=document.createElement('tr'); const tdE=document.createElement('td'); tdE.colSpan=DISPLAY_COLUMNS.length; tdE.style.height=bottomPad+"px"; trE.appendChild(tdE); frag.appendChild(trE); }

    $tbody.appendChild(frag);
    markSort();
  }

  function applySolidHeat(td, val, mm){ const {min,max}=mm||{}; if(min==null||max==null||max<=min||val==null){ td.style.backgroundColor='transparent'; return; } const norm = (val - min) / (max - min); const hue = 120 * norm; td.style.backgroundColor = `hsla(${hue}, 80%, 30%, 0.42)`; }

  // -------- URL-state --------
  function syncURL(){
    const p = new URLSearchParams();
    if(state.filterText) p.set('q', state.filterText);
    if(state.sort.key){ p.set('sort', state.sort.key); p.set('dir', String(state.sort.dir)); }
    if(state.pageSize) p.set('ps', String(state.pageSize));
    if(state.page>1)  p.set('p', String(state.page));
    for(const [key,conf] of Object.entries(state.colFilters)){
      if(!conf) continue;
      if(conf.kind==='text') p.set(`cf_${key}`, `t:${encodeURIComponent(conf.value)}`);
      else if(conf.kind==='range') p.set(`cf_${key}`, `r:${conf.min??''}:${conf.max??''}`);
      else if(conf.kind==='multi'){ const set = conf.set instanceof Set ? [...conf.set] : conf.set; p.set(`cf_${key}`, `m:${set.map(v=>encodeURIComponent(String(v))).join('|')}`); }
    }
    history.replaceState(null,'', `${location.pathname}?${p.toString()}`);
  }

  function restoreFromURL(){
    const p = new URLSearchParams(location.search);
    state.filterText = p.get('q') || ''; $q.value = state.filterText;
    const sort = p.get('sort'); const dir = parseInt(p.get('dir')||'1',10);
    if (sort && SCHEMA_MAP.has(sort)) state.sort={key:sort, dir:(dir===-1?-1:1)};
    const ps = parseInt(p.get('ps')||'100',10); state.pageSize = Number.isFinite(ps)?ps:100;
    const pg = parseInt(p.get('p')||'1',10); state.page = Number.isFinite(pg)&&pg>0?pg:1;

    for(const key of DISPLAY_COLUMNS){
      const raw = p.get(`cf_${key}`); if(!raw) continue;
      const [kind, a, b] = raw.split(':');
      const t = SCHEMA_MAP.get(key).type;
      if (kind==='t'){ state.colFilters[key] = { kind:'text', value: decodeURIComponent(a||'') } }
      else if (kind==='r'){ const min = a? Number(decodeURIComponent(a)) : null; const max = b? Number(decodeURIComponent(b)) : null; state.colFilters[key] = { kind:'range', min, max } }
      else if (kind==='m'){
        const listRaw = (a||'').split('|').filter(Boolean).map(x=> decodeURIComponent(x));
        let list;
        if (t==='bool') list = listRaw.map(x=> x==='true');
        else if (t==='int') list = listRaw.map(x=> Number(x)).filter(n=> Number.isFinite(n));
        else list = listRaw;
        state.colFilters[key] = { kind:'multi', set: new Set(list) }
      }
    }
  }
  </script>
